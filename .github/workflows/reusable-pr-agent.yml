name: PR-Agent AI Code Review

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

  workflow_call:
    inputs:
      runner:
        description: Runner label for the jobs (e.g. self-hosted)
        type: string
        default: ubuntu-latest
    secrets:
      OPENAI_KEY:
        required: true
      NVIDIA_NIM_API_KEY:
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  # Free-provider quotas are shared by every PR in this repository. Run only
  # one review at a time so separate PRs cannot create a request burst.
  group: pr-agent-quota-${{ github.repository }}
  cancel-in-progress: false

jobs:
  pr-agent:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 8

    steps:
      - name: Stagger provider requests
        shell: bash
        run: |
          # Spread queued workflow starts over a small window. This reduces
          # transient 429s when several repositories share the same API key.
          delay=$((20 + RANDOM % 41))
          echo "Waiting ${delay}s before contacting model providers."
          sleep "$delay"

      - name: PR Agent Review
        uses: The-PR-Agent/pr-agent@v0.48.0

        env:
          # =====================================================
          # Authentication
          # =====================================================
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENAI_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}

          # Keep the OpenRouter prefix for LiteLLM. The provider behind the
          # first fallback differs from the primary model's provider.
          CONFIG.MODEL: openrouter/google/gemma-4-31b-it:free
          CONFIG.FALLBACK_MODELS: >
            [
              "openrouter/nvidia/nemotron-3.5-lightning:free",
              "openrouter/google/gemma-4-26b-a4b-it:free"
            ]

          LITELLM.DROP_PARAMS: "true"
          CONFIG.AI_TIMEOUT: "30"

          # Retry GitHub API secondary-rate-limit responses independently of
          # model-provider failover.
          GITHUB.RATELIMIT_RETRIES: "5"

          # =====================================================
          # Speed Optimizations
          # =====================================================
          CONFIG.MAX_DESCRIPTION_TOKENS: "300"

          CONFIG.CUSTOM_MODEL_MAX_TOKENS: "12000"
          CONFIG.MAX_MODEL_TOKENS: "12000"
          CONFIG.MAX_CONTEXT_TOKENS: "16000"

          CONFIG.TEMPERATURE: "0"

          # =====================================================
          # Lightweight Review Features
          # =====================================================
          PR_REVIEWER.REQUIRE_SCORE_REVIEW: "true"

          # Keep security review enabled
          PR_REVIEWER.REQUIRE_SECURITY_REVIEW: "true"

          # Disable slower secondary reviews
          PR_REVIEWER.REQUIRE_TESTS_REVIEW: "false"
          PR_REVIEWER.REQUIRE_ESTIMATE_EFFORT_TO_REVIEW: "false"

          # Security labels
          PR_REVIEWER.ENABLE_REVIEW_LABELS_SECURITY: "true"

          # =====================================================
          # Inline Suggestions
          # =====================================================
          PR_REVIEWER.INLINE_CODE_COMMENTS: "true"

          PR_REVIEWER.NUM_CODE_SUGGESTIONS: "1"

          PR_CODE_SUGGESTIONS.NUM_CODE_SUGGESTIONS: "1"
          PR_CODE_SUGGESTIONS.COMMITABLE_CODE_SUGGESTIONS: "false"

          # =====================================================
          # Disable Extra Generation
          # =====================================================
          PR_DESCRIPTION.PUBLISH_DESCRIPTION_AS_COMMENT: "false"
          PR_DESCRIPTION.USE_DESCRIPTION_MARKERS: "false"

          # =====================================================
          # Focused Enterprise .NET + Security Review
          # =====================================================
          PR_REVIEWER.EXTRA_INSTRUCTIONS: |
            Review only critical and high-impact issues.

            Focus on:
            - bugs
            - race conditions
            - thread safety
            - async/await misuse
            - deadlocks
            - cancellation propagation
            - EF Core N+1 queries
            - transaction consistency
            - null safety
            - DI lifetime issues
            - major performance bottlenecks

            Security checks:
            - secrets exposure
            - hardcoded credentials
            - insecure configuration
            - missing authorization
            - authentication flaws
            - privilege escalation risks
            - insecure deserialization
            - SQL injection risks
            - command injection risks
            - SSRF vulnerabilities
            - XSS vulnerabilities
            - CSRF issues
            - path traversal
            - unsafe file handling
            - weak cryptography usage
            - insecure token handling
            - sensitive data leakage
            - missing input validation
            - insecure logging of sensitive data

            Ignore:
            - style
            - formatting
            - naming
            - low-impact suggestions
            - minor optimizations

            Keep comments:
            - short
            - technical
            - actionable
            - fix-oriented

      # Self-hosted runners keep their workspace between jobs: empty it when the job ends, whatever its result.
      - name: Clean the runner
        if: ${{ always() && inputs.runner == 'self-hosted' }}
        uses: atos-actions/clean-self-hosted-runner@4e721c03ebc4eef7beeed088ad4062e3790ef2ae # v1.4.43
