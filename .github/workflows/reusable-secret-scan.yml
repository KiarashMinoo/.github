name: Reusable — Secret Scan (Gitleaks)

# Scans git history for hardcoded credentials with https://github.com/gitleaks/gitleaks.
#
#   * pull_request / push  -> only the NEW commits (base..head), failing the run on any finding, so a
#                              secret can never be merged or pushed silently.
#   * schedule / dispatch  -> the FULL history. Old findings are reported (SARIF + artifact) but do not
#                              fail the run by default (fail-on-history-findings: false), because a leaked
#                              historical secret has to be ROTATED, not fixed by a code change.
#
# Findings are always redacted in logs, reports and annotations.
#
# Bumping gitleaks: change BOTH inputs `gitleaks-version` and `gitleaks-sha256` (the linux_x64 tarball's
# sha256 is listed on the release page, https://github.com/gitleaks/gitleaks/releases).

on:
  workflow_call:
    inputs:
      gitleaks-version:
        description: gitleaks release to install (without the leading v)
        type: string
        default: '8.30.1'
      gitleaks-sha256:
        description: sha256 of gitleaks_<version>_linux_x64.tar.gz — the download is rejected on mismatch
        type: string
        default: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
      config-path:
        description: gitleaks config file; the built-in default rules are used when the file does not exist
        type: string
        default: '.gitleaks.toml'
      fail-on-findings:
        description: Fail when a pull request / push introduces a secret in its new commits
        type: boolean
        default: true
      fail-on-history-findings:
        description: Fail when a full-history scan (schedule / manual run) finds anything
        type: boolean
        default: false
      upload-sarif:
        description: Upload the SARIF report to GitHub code scanning when it is available
        type: boolean
        default: true
    secrets:
      gh-token:
        description: GitHub token with security-events:write for the SARIF upload
        required: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks ${{ inputs.gitleaks-version }}
        shell: bash
        env:
          VERSION: ${{ inputs.gitleaks-version }}
          SHA256: ${{ inputs.gitleaks-sha256 }}
        run: |
          set -euo pipefail
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${archive}"
          echo "${SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Scan
        id: scan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          CONFIG: ${{ inputs.config-path }}
          FAIL_NEW: ${{ inputs.fail-on-findings }}
          FAIL_HISTORY: ${{ inputs.fail-on-history-findings }}
        run: |
          set -uo pipefail
          # Exit code 2 = leaks found, so they stay distinguishable from a tool error (exit 1).
          args=(git --no-banner --redact --exit-code 2 --report-format sarif --report-path gitleaks.sarif)
          [ -f "$CONFIG" ] && args+=(--config "$CONFIG")

          scope="full history"
          fail="$FAIL_HISTORY"
          range=""
          case "$EVENT" in
            pull_request|pull_request_target)
              range="${PR_BASE}..${PR_HEAD}" ;;
            push)
              if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
                 && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                range="${PUSH_BEFORE}..${PUSH_AFTER}"
              fi ;;
          esac
          if [ -n "$range" ]; then
            scope="new commits ($range)"
            fail="$FAIL_NEW"
            args+=(--log-opts="$range")
          fi

          echo "Scanning $scope"
          set +e
          gitleaks "${args[@]}" .
          code=$?
          set -e

          findings=0
          if [ -f gitleaks.sarif ]; then
            findings=$(jq '[.runs[].results | length] | add // 0' gitleaks.sarif)
          fi

          {
            echo "### Gitleaks"
            echo ""
            echo "- Scope: $scope"
            echo "- Findings: **$findings** (redacted)"
            echo "- Blocking for this scope: $fail"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "findings=$findings" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "fail=$fail" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF report
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-sarif-report
          path: gitleaks.sarif
          retention-days: 5

      - name: Check Code Scanning availability
        id: ghas
        if: always() && inputs.upload-sarif && hashFiles('gitleaks.sarif') != '' && github.event.pull_request.head.repo.fork != true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.gh-token }}
        run: |
          http=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/code-scanning/alerts?per_page=1")
          [[ "$http" == "200" ]] && echo "enabled=true" >> "$GITHUB_OUTPUT" || echo "enabled=false" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF to Code Scanning
        if: always() && steps.ghas.outputs.enabled == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Fail on findings
        if: always() && steps.scan.outputs.code != '0'
        shell: bash
        env:
          CODE: ${{ steps.scan.outputs.code }}
          FAIL: ${{ steps.scan.outputs.fail }}
          FINDINGS: ${{ steps.scan.outputs.findings }}
        run: |
          if [ "$CODE" = "2" ]; then
            echo "::error::Gitleaks found $FINDINGS potential secret(s). Download the gitleaks-sarif-report artifact (values are redacted); rotate anything that was real."
            [ "$FAIL" = "true" ] && exit 1
            echo "::warning::Findings reported but not blocking for this scan scope."
            exit 0
          fi
          echo "::error::gitleaks failed to run (exit $CODE)."
          exit "$CODE"
